<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- پس‌زمینه گرادیانت ملایم -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F7FC"/>
      <stop offset="100%" stop-color="#E8EFF7"/>
    </linearGradient>

    <!-- گرادیانت خطوط هگزاگون -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#009E7F"/>
    </linearGradient>

    <!-- گرادیانت خطوط داخلی -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3E8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00DFA2" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- پس‌زمینه گرد گوشه -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)"/>

  <!-- دایره چین خط‌چین سبز (بیرونی) -->
  <circle cx="256" cy="256" r="175"
          fill="none"
          stroke="#00DFA2"
          stroke-width="3"
          stroke-dasharray="8 12"
          opacity="0.85"/>

  <!-- خطوط داخلی متصل به هگزاگون (پشت هگزاگون) -->
  <g stroke="url(#lineGrad)" stroke-width="2.5" fill="none" opacity="0.75">
    <line x1="120" y1="180" x2="256" y2="120"/>
    <line x1="120" y1="180" x2="120" y2="332"/>
    <line x1="120" y1="332" x2="256" y2="392"/>
    <line x1="392" y1="180" x2="256" y2="120"/>
    <line x1="392" y1="180" x2="392" y2="332"/>
    <line x1="392" y1="332" x2="256" y2="392"/>
    <line x1="256" y1="120" x2="256" y2="256"/>
    <line x1="120" y1="180" x2="256" y2="256"/>
    <line x1="392" y1="180" x2="256" y2="256"/>
    <line x1="256" y1="256" x2="256" y2="392"/>
  </g>

  <!-- هگزاگون اصلی -->
  <polygon points="256,100 391,180 391,332 256,412 121,332 121,180"
           fill="rgba(255,255,255,0.55)"
           stroke="url(#hexGrad)"
           stroke-width="5"
           stroke-linejoin="round"/>

  <!-- نقطه‌های گوشه هگزاگون (روی شش راس) -->
  <g fill="#00C8FF">
    <circle cx="256" cy="100" r="11"/>
    <circle cx="391" cy="180" r="11"/>
    <circle cx="391" cy="332" r="11"/>
    <circle cx="256" cy="412" r="11"/>
    <circle cx="121" cy="332" r="11"/>
    <circle cx="121" cy="180" r="11"/>
  </g>

  <!-- نقطه‌های درخشان روی گوشه‌ها -->
  <g fill="#00DFA2">
    <circle cx="256" cy="100" r="5"/>
    <circle cx="391" cy="180" r="5"/>
    <circle cx="391" cy="332" r="5"/>
    <circle cx="256" cy="412" r="5"/>
    <circle cx="121" cy="332" r="5"/>
    <circle cx="121" cy="180" r="5"/>
  </g>

  <!-- حرف P (اصلی) -->
  <text x="256" y="330"
        font-family="'Plus Jakarta Sans', 'Arial Black', Arial, sans-serif"
        font-size="240"
        font-weight="900"
        fill="#0F172A"
        text-anchor="middle">P</text>

  <!-- خط کوچک زیر P -->
  <rect x="310" y="345" width="55" height="14" rx="7" fill="#00C8FF"/>
</svg>
