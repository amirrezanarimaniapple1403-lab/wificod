<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F7FC"/>
      <stop offset="100%" stop-color="#E2E8F4"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DFA2"/>
      <stop offset="50%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#006C4D"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing concentric circle -->
  <circle cx="256" cy="256" r="190" fill="rgba(255,255,255,0.7)" stroke="#00DFA2" stroke-width="3" stroke-dasharray="8 6" opacity="0.8"/>
  <circle cx="256" cy="256" r="165" fill="#FFFFFF" filter="drop-shadow(0 12px 28px rgba(0,223,162,0.25))"/>
  
  <!-- Hexagon grid lines -->
  <polygon points="256,120 360,180 360,300 256,360 152,300 152,180" fill="none" stroke="url(#hexGrad)" stroke-width="3.5" filter="url(#neonGlow)"/>
  
  <!-- Circuit Nodes -->
  <circle cx="256" cy="120" r="7" fill="#00DFA2"/>
  <circle cx="360" cy="180" r="7" fill="#00C8FF"/>
  <circle cx="360" cy="300" r="7" fill="#00DFA2"/>
  <circle cx="256" cy="360" r="7" fill="#00C8FF"/>
  <circle cx="152" cy="300" r="7" fill="#00DFA2"/>
  <circle cx="152" cy="180" r="7" fill="#00C8FF"/>
  
  <!-- Inner connection lines -->
  <line x1="256" y1="120" x2="256" y2="360" stroke="#00DFA2" stroke-width="1.5" opacity="0.4"/>
  <line x1="152" y1="180" x2="360" y2="300" stroke="#00C8FF" stroke-width="1.5" opacity="0.4"/>
  <line x1="152" y1="300" x2="360" y2="180" stroke="#00DFA2" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Bold "P_" Logo -->
  <path d="M 210,180 L 265,180 C 295,180 315,195 315,225 C 315,255 295,270 265,270 L 240,270 L 240,325 L 210,325 Z M 240,205 L 240,245 L 262,245 C 278,245 285,238 285,225 C 285,212 278,205 262,205 Z" fill="#101828"/>
  <rect x="290" y="308" width="30" height="12" rx="4" fill="#00C8FF"/>
</svg>
